<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132334"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="An original geometric construction puzzle game by Noorullah Adel. Draw with a compass and straightedge, then discover why each solution works.">
<title>Arc &amp; Ink · Geometry Laboratory</title>
<link rel="icon" href="./icons/mark.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icons/apple.png">
<link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css">
<script defer src="./js/geometry.js"></script><script defer src="./js/atlas.js"></script><script defer src="./js/game.js"></script>
</head><body><div id="arc-game">
  <header class="mast">
    <div class="wordmark"><span class="logo-stamp"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="m11 7-6 14m8-14 6 14M8.3 15a6.2 6.2 0 0 0 7.4 0"/></svg></span><span>Arc <i>&amp;</i> Ink</span></div>
    <nav class="modes" aria-label="Laboratory modes">
      <button id="atlas-open" aria-haspopup="dialog"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 5 6-2 7 2 6-2v16l-6 2-7-2-6 2zM8.5 3v16m7-14v16"/></svg><span>Atlas</span></button>
      <button id="daily-open"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>Daily</span></button>
      <button id="free-open"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6m-5 0v6L4.8 18a2 2 0 0 0 1.7 3h11a2 2 0 0 0 1.7-3L14 9V3M7.5 14h9"/></svg><span>Free lab</span></button>
    </nav>
    <div class="mast-end"><button class="box-btn" id="focus-toggle" aria-label="Enter focus view" title="Focus view" aria-pressed="false"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></svg></button><button class="box-btn" id="options" aria-label="Settings, help and installation" title="Settings and guide"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div>
  </header>
  <main class="workbench">
    <aside class="page">
      <div class="chapter"><span class="rule"></span><span id="chapter">First marks</span></div>
      <div class="page-number" id="number">Experiment 01 / 16</div>
      <h1 id="title">The meeting line</h1>
      <p id="brief" class="brief">Draw one straight line through both crossings of the two ink circles.</p>
      <div class="measure" aria-label="Move statistics"><div><span id="moves">0</span><small>Moves</small></div><div><span id="par">1</span><small>Target</small></div><div><span id="best">—</span><small>Personal best</small></div></div>
      <div id="journal"><button class="paper-btn" id="hint" aria-haspopup="dialog"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17h6m-5 3h4M9 14c0-2-3-2.4-3-6a6 6 0 0 1 12 0c0 3.6-3 4-3 6z"/></svg><span>Open a hint</span></button></div>
      <div class="folio"><div class="folio-line"><span>Atlas progress</span><b id="book-count">0 / 16</b></div><div class="meter"><span id="book-bar"></span></div><p>Developed and designed by<br><strong>Noorullah Adel</strong> · 2026</p></div>
    </aside>
    <section class="draft" aria-label="Construction workbench">
      <div class="table-head"><div class="table-caption"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18M3 15h18M9 3v18m6-18v18"/></svg><span>Drafting table</span></div><button id="focus-goal" class="focus-goal" hidden>Goal</button><span id="goal-count"></span><div class="zoom"><button id="minus" title="Zoom out" aria-label="Zoom out"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button><button id="fit" title="Fit original diagram" aria-label="Fit original diagram"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/></svg></button><button id="plus" title="Zoom in" aria-label="Zoom in"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
      <div class="board-wrap" id="board-wrap"><svg id="board" tabindex="0" role="group" aria-label="Geometric drawing. Select labeled points on the board or use the Points button." xmlns="http://www.w3.org/2000/svg"><title>Geometric construction</title></svg></div>
      <div class="readout"><span class="readout-mark"></span><span id="instruction" aria-live="polite" aria-atomic="true">Choose a point.</span><button id="point-list" class="node-btn"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2"/><circle cx="18" cy="4" r="2"/><circle cx="12" cy="18" r="2"/><path d="m6 8 5 8m2-1 4-9"/></svg>Points</button></div>
      <div id="trace-row" class="trace-row" hidden><button id="trace-prev" aria-label="Previous construction step">Previous</button><span id="trace-count"></span><button id="trace-next" aria-label="Next construction step">Next</button><button id="trace-exit">Done</button></div>
      <div class="instruments" id="instruments" aria-label="Instruments"><div class="tools"><button data-tool="line" aria-pressed="true"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m3 21 18-18"/><circle cx="6" cy="18" r="2.2" fill="currentColor" stroke="none"/><circle cx="18" cy="6" r="2.2" fill="currentColor" stroke="none"/></svg><span>Straightedge</span></button><button data-tool="circle" aria-pressed="false"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.3"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><path d="m12 12 6-6" opacity=".7"/></svg><span>Compass</span></button><button data-tool="pin" aria-pressed="false"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="5"/><path d="m9 14 3 6 3-6"/></svg><span>Pin</span></button><button data-tool="point" hidden aria-pressed="false"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4m0 10v4M3 12h4m10 0h4"/><circle cx="12" cy="12" r="3"/></svg><span>Point</span></button></div><div class="history"><button id="undo" aria-label="Undo one move" title="Undo"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h10a6 6 0 0 1 0 12" transform="translate(0 -3)"/><path d="m8 3-4 4 4 4"/></svg></button><button id="redo" aria-label="Redo one move" title="Redo"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7H10a6 6 0 0 0 0 12"/><path d="m16 3 4 4-4 4"/></svg></button></div></div>
    </section>
  </main>
  <div id="dialog" class="shade" role="dialog" aria-modal="true" aria-labelledby="dialog-title" hidden><section class="sheet"><div class="sheet-head"><h2 id="dialog-title"></h2><button class="box-btn" id="close" aria-label="Close dialog"><svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m5 5 14 14m0-14L5 19"/></svg></button></div><div id="dialog-body"></div></section></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript>Enable JavaScript to use the compass and straightedge.</noscript>
</div></body></html>
